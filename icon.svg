<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- ===== Background: deep space gradient ===== -->
    <radialGradient id="wdBg" cx="50%" cy="42%" r="72%">
      <stop offset="0%"   stop-color="#12203c"/>
      <stop offset="45%"  stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>

    <!-- ===== Ambient glow behind radar ===== -->
    <radialGradient id="wdAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e0a857" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#e0a857" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#e0a857" stop-opacity="0"/>
    </radialGradient>

    <!-- ===== Sweep beam: radial gradient from center outward ===== -->
    <radialGradient id="wdBeam" cx="50%" cy="50%" r="35%">
      <stop offset="0%"   stop-color="#ffe0a0" stop-opacity="0.95"/>
      <stop offset="35%"  stop-color="#f0c074" stop-opacity="0.55"/>
      <stop offset="75%"  stop-color="#e0a857" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e0a857" stop-opacity="0"/>
    </radialGradient>

    <!-- ===== Center dot glow ===== -->
    <radialGradient id="wdCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff8e8" stop-opacity="1"/>
      <stop offset="45%"  stop-color="#f0c074" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0a857" stop-opacity="0"/>
    </radialGradient>

    <!-- ===== Soft outer glow filter ===== -->
    <filter id="wdSoftGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ===== Center halo (subtle outer glow around dot) ===== -->
    <filter id="wdHalo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="512" height="512" fill="url(#wdBg)"/>

  <!-- ==================== AMBIENT GLOW ==================== -->
  <circle cx="256" cy="256" r="230" fill="url(#wdAmbient)"/>

  <!-- ==================== RADAR RINGS ==================== -->
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="180"
          fill="none" stroke="#e0a857" stroke-opacity="0.18" stroke-width="3"/>
  <!-- Middle ring -->
  <circle cx="256" cy="256" r="120"
          fill="none" stroke="#e0a857" stroke-opacity="0.30" stroke-width="3"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="60"
          fill="none" stroke="#e0a857" stroke-opacity="0.50" stroke-width="3"/>

  <!-- ==================== CROSSHAIR (subtle) ==================== -->
  <g stroke="#e0a857" stroke-opacity="0.10" stroke-width="2">
    <line x1="256" y1="76"  x2="256" y2="436"/>
    <line x1="76"  y1="256" x2="436" y2="256"/>
  </g>

  <!-- ==================== SWEEP BEAM ==================== -->
  <!-- Wedge from top (-90°) to -30° clockwise — 60° wide -->
  <path d="M 256 256 L 256 76 A 180 180 0 0 1 411.88 166 Z"
        fill="url(#wdBeam)"/>

  <!-- ==================== CENTER HALO & DOT ==================== -->
  <!-- Soft halo behind dot -->
  <circle cx="256" cy="256" r="46" fill="#e0a857" fill-opacity="0.55" filter="url(#wdHalo)"/>
  <!-- Glow ring -->
  <circle cx="256" cy="256" r="26" fill="url(#wdCenter)" filter="url(#wdSoftGlow)"/>
  <!-- Solid core -->
  <circle cx="256" cy="256" r="15" fill="#fff8e8"/>
  <!-- Ring outline for crispness -->
  <circle cx="256" cy="256" r="15" fill="none" stroke="#e0a857" stroke-width="2.5" stroke-opacity="0.9"/>

  <!-- ==================== TARGETING TICKS (cardinal) ==================== -->
  <g stroke="#ffe0a0" stroke-width="4.5" stroke-linecap="round" opacity="0.95">
    <!-- Top -->
    <line x1="256" y1="66" x2="256" y2="82"/>
    <!-- Bottom -->
    <line x1="256" y1="430" x2="256" y2="446"/>
    <!-- Left -->
    <line x1="66"  y1="256" x2="82"  y2="256"/>
    <!-- Right -->
    <line x1="430" y1="256" x2="446" y2="256"/>
  </g>

  <!-- ==================== DIAGONAL ACCENTS (subtle) ==================== -->
  <g stroke="#e0a857" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <line x1="135" y1="135" x2="148" y2="148"/>
    <line x1="364" y1="364" x2="377" y2="377"/>
    <line x1="135" y1="377" x2="148" y2="364"/>
    <line x1="364" y1="148" x2="377" y2="135"/>
  </g>
</svg>