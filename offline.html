<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070c16">
<title>WAR DESK · Offline</title>
<style>
  :root {
    --bg: #070c16;
    --ink: #e6ebf5;
    --ink-2: #8a94a8;
    --amber: #e0a857;
    --card: #111b2d;
    --line: #1a2540;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    line-height: 1.5;
  }
  .offline-card {
    max-width: 420px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 2rem 1.5rem;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .offline-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    display: block;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--amber);
    margin-bottom: 0.75rem;
    letter-spacing: 0.02em;
  }
  p {
    font-size: 0.9rem;
    color: var(--ink-2);
    margin-bottom: 0.5rem;
  }
  .hint {
    font-size: 0.8rem;
    color: var(--ink-2);
    opacity: 0.7;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  button {
    margin-top: 1.25rem;
    padding: 0.75rem 1.5rem;
    background: linear-gradient(135deg, #f0c78a, #e0a857, #8a5c26);
    color: #070c16;
    border: none;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
<div class="offline-card">
  <span class="offline-icon">📡</span>
  <h1>Even geen verbinding</h1>
  <p>WAR DESK kon geen verbinding maken met het netwerk.</p>
  <p>Controleer je internet en probeer opnieuw.</p>
  <button onclick="location.reload()">Opnieuw proberen</button>
  <p class="hint">Je eerder geladen artikelen zijn nog beschikbaar zodra je terug online bent.</p>
</div>
</body>
</html>
