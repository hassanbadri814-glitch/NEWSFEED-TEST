name = "newsfeed2"
main = "worker-ai.js"
compatibility_date = "2024-09-23"

# KV namespace voor rate limiting
# Na `wrangler kv:namespace create RATE_LIMIT_KV` krijg je een id.
# Vul die hier in:
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "PLAK_HIER_JE_KV_ID"

# Environment variables
[vars]
# Zet hier de URL van je AI backend (de bestaande AI service).
# Als je AI rechtstreeks in deze Worker zit, laat leeg.
AI_BACKEND_URL = ""

# Optioneel: preview omgeving
[env.preview]
[env.preview.vars]
AI_BACKEND_URL = ""