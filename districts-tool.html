<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ISR + PSE Extractor</title>
<style>
body { background:#0a0e14; color:#e6ebf5; font-family:monospace; padding:16px; }
h1 { color:#e0a857; font-size:16px; }
#status { padding:12px; margin:10px 0; background:#111b2d; border-radius:8px; }
#result { white-space:pre-wrap; background:#111b2d; padding:12px; border-radius:8px; font-size:11px; line-height:1.4; }
button { background:#e0a857; color:#0a0e14; border:0; padding:10px 20px; border-radius:8px; font-weight:700; font-size:14px; margin:10px 0; cursor:pointer; }
</style>
</head>
<body>
<h1>🇮🇱🇵🇸 ISR + PSE Extractor</h1>
<button onclick="run()">▶ Start extractie</button>
<div id="status">Klaar om te starten...</div>
<div id="result"></div>

<script>
const PROXIES = [
  'https://newsfeed2.hassanbadri814.workers.dev/?url=',
  'https://nieuwsproxy.hassanbadri814.workers.dev/?url=',
  'https://api.allorigins.win/raw?url='
];

async function fetchGadm(baseUrl) {
  for (let i = 0; i < PROXIES.length; i++) {
    try {
      const url = PROXIES[i] + encodeURIComponent(baseUrl);
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch(e) { /* probeer volgende proxy */ }
  }
  throw new Error('Alle proxies faalden voor ' + baseUrl);
}

async function run() {
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  statusEl.textContent = 'Bezig met laden... (kan 30-60 sec duren)';
  resultEl.textContent = '';

  const countries = [
    { code: 'ISR', label: '🇮🇱 Israël',   url: 'https://geodata.ucdavis.edu/gadm/gadm4.1/json/gadm41_ISR_1.json' },
    { code: 'PSE', label: '🇵🇸 Palestina', url: 'https://geodata.ucdavis.edu/gadm/gadm4.1/json/gadm41_PSE_1.json' }
  ];

  let out = '';

  for (const c of countries) {
    try {
      statusEl.textContent = 'Laden ' + c.label + '...';
      const data = await fetchGadm(c.url);
      if (!data || !data.features) throw new Error('Geen features');

      out += '═══════════════════════════════════\n';
      out += c.label + ' (' + c.code + ') — TOTAAL: ' + data.features.length + '\n';
      out += '═══════════════════════════════════\n';

      const names = data.features.map(f => {
        const p = f.properties || {};
        return p.NAME_1 || p.NAME_0 || '?';
      });
      names.sort((a,b) => a.localeCompare(b));
      names.forEach(n => { out += '  - ' + n + '\n'; });
      out += '\n';
    } catch(e) {
      out += '═══════════════════════════════════\n';
      out += c.label + ' — FOUT: ' + e.message + '\n\n';
    }
  }

  statusEl.innerHTML = '✅ Klaar';
  resultEl.textContent = out;
}
</script>
</body>
</html>
