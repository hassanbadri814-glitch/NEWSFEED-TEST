<!-- ============================================================
     EARLY BOOTSTRAP — theme, font-size, accent, oled
     ============================================================ -->
<script>
(function(){
  try {
    var t = localStorage.getItem("wardesk_theme");
    if (t === "light" || (!t && matchMedia("(prefers-color-scheme:light)").matches)) {
      document.documentElement.classList.add("light");
    }
  } catch(e) {}

  try {
    var fs = localStorage.getItem("wardesk_font_size") || "medium";
    var ac = localStorage.getItem("wardesk_accent_color") || "goud";
    var map = { amber:"goud", blue:"saffier", green:"smaragd", red:"koraal", mono:"parel" };
    if (map[ac]) { ac = map[ac]; localStorage.setItem("wardesk_accent_color", ac); }
    if (["goud","saffier","smaragd","kobalt","koraal","parel"].indexOf(ac) < 0) ac = "goud";
    if (["small","medium","large","xlarge"].indexOf(fs) < 0) fs = "medium";
    document.documentElement.setAttribute("data-font-size", fs);
    document.documentElement.setAttribute("data-accent", ac);
    if (localStorage.getItem("wardesk_oled_mode") === "1") {
      document.documentElement.setAttribute("data-oled", "true");
    }
  } catch(e) {}

  /* Dynamische theme-color (adresbalk) */
  window.__wdUpdateThemeColor = function(){
    var meta = document.getElementById("themeColorMeta");
    if (!meta) return;
    var isLight = document.documentElement.classList.contains("light");
    var isOled  = document.documentElement.getAttribute("data-oled") === "true";
    meta.content = isOled ? "#000000" : (isLight ? "#f5f5f7" : "#070c16");
  };
  window.__wdUpdateThemeColor();
  new MutationObserver(window.__wdUpdateThemeColor).observe(document.documentElement,
    { attributes: true, attributeFilter: ["class","data-oled"] });
})();
</script>

<style>
/* ============================================================
   WAR DESK v13.1 — COMPLETE CSS
   ============================================================ */

:root {
  --amber: #e0a857;
  --amber-2: #f0c78a;
  --amber-3: #8a5c26;
  --accent-glow: rgba(224,168,87,.35);
  --bg: #070c16;
  --bg-2: #0d1522;
  --bg-3: #131e30;
  --card: #111b2d;
  --card-hover: #18253c;
  --line: #1a2540;
  --line-2: #26344f;
  --ink: #e6ebf5;
  --ink-2: #8a94a8;
  --ink-3: #6b7a93;
  --radius: 12px;
  --shadow-card: 0 2px 8px rgba(0,0,0,.3);
  --shadow-deep: 0 8px 32px rgba(0,0,0,.5);
}

/* --- ACCENT THEMES --- */
html[data-accent="goud"]    { --amber:#e0a857; --amber-2:#f0c78a; --amber-3:#8a5c26; --accent-glow:rgba(224,168,87,.35); }
html[data-accent="saffier"] { --amber:#5b9dff; --amber-2:#93c2ff; --amber-3:#1e40af; --accent-glow:rgba(91,157,255,.35); }
html[data-accent="smaragd"] { --amber:#2dd4a8; --amber-2:#6ee7c8; --amber-3:#065f46; --accent-glow:rgba(45,212,168,.35); }
html[data-accent="kobalt"]  { --amber:#8b7fff; --amber-2:#b3aaff; --amber-3:#3a2a99; --accent-glow:rgba(139,127,255,.35); }
html[data-accent="koraal"]  { --amber:#ff6b7a; --amber-2:#ff9ba6; --amber-3:#991b2c; --accent-glow:rgba(255,107,122,.35); }
html[data-accent="parel"]   { --amber:#e8eaf0; --amber-2:#ffffff; --amber-3:#6b7280; --accent-glow:rgba(232,234,240,.35); }

html[data-oled="true"] {
  --bg:#000000; --bg-2:#050505; --bg-3:#0d0d0d; --card:#080808;
  --accent-glow: rgba(224,168,87,.22);
}

/* --- FONT SIZE --- */
html[data-font-size="small"]  { font-size: 14px; }
html[data-font-size="medium"] { font-size: 16px; }
html[data-font-size="large"]  { font-size: 18px; }
html[data-font-size="xlarge"] { font-size: 20px; }

/* --- LIGHT MODE (basis) --- */
html.light {
  --bg:#f5f5f7; --bg-2:#ffffff; --bg-3:#ececf1;
  --card:#ffffff; --card-hover:#f4f4f8;
  --line:#e2e4ec; --line-2:#cdd2dd;
  --ink:#131721; --ink-2:#4a5165; --ink-3:#7a8295;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 0;
  font-size: 1rem;
}

/* ============================================================
   SVG GUARD — voorkomt blow-up van inline iconen
   ============================================================ */
svg {
  max-width: 100%;
  max-height: 100%;
  flex-shrink: 0;
  display: inline-block;
  vertical-align: middle;
}
svg:not([width]):not([height]) {
  width: 1em;
  height: 1em;
}

/* Iconen in knoppen en lijsten altijd klein houden */
.vod-sidebar-item svg,
.vod-sidebar-item img,
.news-filters svg,
.filter-chip svg,
.live-filter svg,
.map-ctrl svg,
.map-ctrl img,
.iptv-btn svg,
.iptv-btn img,
.section-head svg,
.card-actions svg,
.brand-mark svg {
  width: 18px !important;
  height: 18px !important;
  max-width: 18px !important;
  max-height: 18px !important;
  flex-shrink: 0;
}

/* Filter chips iets groter */
.news-filters .filter-chip svg,
.vod-sidebar-item svg {
  width: 20px !important;
  height: 20px !important;
  max-width: 20px !important;
  max-height: 20px !important;
}

/* Merk-logo mag groter */
.brand-mark svg { width: 28px !important; height: 28px !important; }

/* Zoek-icoon in VOD-input */
.vod-search-icon {
  width: 18px !important;
  height: 18px !important;
  max-width: 18px !important;
  max-height: 18px !important;
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-3);
  pointer-events: none;
}

/* ============================================================
   HEADER
   ============================================================ */
.header {
  background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--line);
  padding: 1rem;
  position: sticky;
  top: 0;
  z-index: 100;
  transition: margin-top .2s;
}
.header-inner {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 1rem;
  align-items: center;
}
.brand { display: flex; align-items: center; gap: .75rem; }
.brand-mark {
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, var(--amber-2), var(--amber-3));
  border-radius: 12px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.brand-text { display: flex; flex-direction: column; }
.brand-text .name {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--amber);
  line-height: 1;
}
.brand-text .tag {
  font-size: .7rem;
  color: var(--ink-3);
  letter-spacing: .1em;
  margin-top: .25rem;
}
.version-badge {
  background: var(--amber);
  color: var(--bg);
  padding: .15rem .4rem;
  border-radius: 4px;
  font-size: .65rem;
  font-weight: 700;
}
.header-stats {
  display: flex;
  gap: 1rem;
  justify-content: space-around;
}
.hstat { display: flex; flex-direction: column; align-items: center; gap: .25rem; }
.hstat-label {
  font-size: .6rem;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: .05em;
}
.hstat-value {
  font-size: 1.1rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.hstat.amber .hstat-value { color: var(--amber); }
.hstat.coral .hstat-value { color: #ff6b7a; }
.hstat.green .hstat-value { color: #2dd4a8; }
.hstat.teal .hstat-value  { color: #06b6d4; }
.header-actions { display: flex; gap: .5rem; }
.btn-mini {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  color: var(--ink-2);
  font-size: 1.2rem;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all .15s;
}
.btn-mini:hover { color: var(--amber); border-color: var(--amber); }

/* ============================================================
   MAIN / VIEWS
   ============================================================ */
.main {
  padding: 1rem;
  padding-bottom: 96px;
}
.view { display: none; }
.view:not([hidden]) { display: block; }

/* ============================================================
   SECTION HEAD
   ============================================================ */
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
  gap: 1rem;
}
.section-head h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  font-weight: 700;
}
.section-head-actions {
  display: flex;
  align-items: center;
  gap: .5rem;
}
.section-count {
  font-size: .85rem;
  color: var(--ink-3);
}

/* ============================================================
   FEED GRID
   ============================================================ */
.feed-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1rem;
}
.news-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: transform .18s, border-color .18s, box-shadow .18s;
}
.news-card.read { opacity: .7; }
.news-card.war { border-left: 3px solid #e63950; }
.card-thumb {
  width: 100%;
  aspect-ratio: 16/9;
  overflow: hidden;
  background: var(--bg-3);
}
.card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.card-body { padding: 1rem; }
.card-meta {
  display: flex;
  align-items: center;
  gap: .5rem;
  font-size: .75rem;
  color: var(--ink-3);
  margin-bottom: .5rem;
  flex-wrap: wrap;
}
.card-source { color: var(--amber); font-weight: 600; }
.card-multi {
  background: var(--bg-3);
  padding: .15rem .4rem;
  border-radius: 4px;
  font-size: .7rem;
}
.card-title {
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: .5rem;
}
.card-original {
  font-size: .72rem;
  color: var(--ink-3);
  font-style: italic;
  margin-bottom: .5rem;
  opacity: .7;
}
.card-desc {
  font-size: .85rem;
  color: var(--ink-2);
  line-height: 1.5;
  margin-bottom: .75rem;
}
.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: .75rem;
  color: var(--ink-3);
}
.card-actions { display: flex; gap: .5rem; }
.card-fav, .card-share {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  color: var(--ink-3);
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all .15s;
}
.card-fav.active {
  background: var(--amber);
  color: var(--bg);
  border-color: var(--amber);
}

/* ============================================================
   BOTTOM TABS
   ============================================================ */
.bottom-tabs {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-2);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  padding: .5rem 0 calc(.5rem + env(safe-area-inset-bottom, 0px)) 0;
  z-index: 9999;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .25rem;
  padding: .5rem;
  background: transparent;
  border: none;
  color: var(--ink-3);
  cursor: pointer;
  transition: color .15s;
}
.tab.active { color: var(--amber); }
.tab-icon { font-size: 1.5rem; line-height: 1; }
.tab-label { font-size: .7rem; font-weight: 600; }

/* ============================================================
   VOD
   ============================================================ */
.vod-search-wrap {
  position: relative;
  margin-bottom: 1rem;
}
.vod-search-wrap input {
  width: 100%;
  padding: .75rem 3rem;
  background: var(--card);
  border: 1px solid var(--line-2);
  border-radius: 10px;
  color: var(--ink);
  font-size: .9rem;
  outline: none;
  transition: all .15s;
}
.vod-search-wrap input:focus {
  border-color: var(--amber);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.vod-search-clear {
  position: absolute;
  right: .5rem;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  background: transparent;
  border: none;
  color: var(--ink-3);
  font-size: 1.2rem;
  cursor: pointer;
}
.vod-page {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 1rem;
}
.vod-sidebar {
  position: sticky;
  top: 1rem;
  max-height: calc(100vh - 200px);
  overflow-y: auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: .5rem;
}
.vod-sidebar-group { margin-bottom: 1rem; }
.vod-sidebar-title {
  font-size: .6rem;
  font-weight: 800;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: .1em;
  padding: .5rem;
}
.vod-sidebar-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .5rem;
  background: transparent;
  border: none;
  color: var(--ink-2);
  font-size: .75rem;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
  transition: all .15s;
}
.vod-sidebar-item:hover { background: var(--bg-3); color: var(--amber); }
.vod-sidebar-item.active {
  background: rgba(224,168,87,.14);
  color: var(--amber);
  font-weight: 700;
}
.vod-sidebar-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.vod-sidebar-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.vod-content { min-width: 0; }
.vod-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: .75rem;
}
.vod-poster {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .18s, border-color .18s, box-shadow .18s;
}
.vod-poster:hover {
  transform: translateY(-2px);
  border-color: var(--amber);
  box-shadow: 0 10px 24px -16px var(--accent-glow);
}
.vod-poster-img {
  width: 100%;
  aspect-ratio: 2/3;
  background: var(--bg-3);
  overflow: hidden;
}
.vod-poster-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.vod-poster-fallback {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  font-size: 2rem;
  font-weight: 800;
  color: var(--amber);
  opacity: .5;
}
.vod-poster-body { padding: .5rem; }
.vod-poster-name {
  font-size: .75rem;
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: .25rem;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.vod-poster-meta { font-size: .6rem; color: var(--ink-3); }
.vod-loading {
  text-align: center;
  padding: 2rem;
  color: var(--amber);
}
.vod-loading[hidden] { display: none; }
.vod-scroll-top {
  position: fixed;
  bottom: 100px;
  right: 16px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--line-2);
  color: var(--amber);
  cursor: pointer;
  display: none;
  place-items: center;
  z-index: 9998;
  font-size: 1.1rem;
}
.vod-scroll-top.show { display: grid; }

/* ============================================================
   IPTV
   ============================================================ */
.iptv-setup {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1rem;
  margin-bottom: 1rem;
}
.iptv-setup-title {
  font-size: .75rem;
  font-weight: 800;
  color: var(--ink-3);
  text-transform: uppercase;
  margin-bottom: 1rem;
  letter-spacing: .08em;
}
.iptv-row { margin-bottom: .75rem; display: flex; gap: .5rem; flex-wrap: wrap; }
.iptv-row input {
  flex: 1;
  min-width: 180px;
  padding: .75rem;
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  color: var(--ink);
  font-size: .9rem;
  outline: none;
  transition: all .15s;
}
.iptv-row input:focus {
  border-color: var(--amber);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.iptv-btn {
  padding: .75rem 1rem;
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  color: var(--ink);
  cursor: pointer;
  font-weight: 600;
  font-size: .85rem;
  transition: all .15s;
}
.iptv-btn:hover { border-color: var(--amber); color: var(--amber); }
.iptv-btn.primary {
  background: var(--amber);
  color: var(--bg);
  border-color: var(--amber);
}
.iptv-btn.danger { color: #e63950; }
.iptv-status {
  margin-top: .5rem;
  font-size: .85rem;
  color: var(--ink-2);
  min-height: 1.2em;
}
.iptv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: .75rem;
}
.iptv-channel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: .75rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: .5rem;
  transition: all .18s;
}
.iptv-channel:hover {
  border-color: var(--amber);
  background: var(--card-hover);
}
.iptv-channel img {
  width: 32px;
  height: 32px;
  object-fit: contain;
  flex-shrink: 0;
}
.iptv-channel-name {
  font-size: .8rem;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ============================================================
   MAP
   ============================================================ */
.map-page {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 1rem;
}
.map-wrap {
  position: relative;
  height: 500px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line);
}
#map { width: 100%; height: 100%; }
.map-controls {
  position: absolute;
  top: 1rem;
  right: 1rem;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  z-index: 500;
}
.map-ctrl {
  width: 40px;
  height: 40px;
  background: var(--card);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  color: var(--ink);
  cursor: pointer;
  font-size: 1.1rem;
  display: grid;
  place-items: center;
  transition: all .15s;
}
.map-ctrl:hover { color: var(--amber); border-color: var(--amber); }

.live-feed {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1rem;
  max-height: 500px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.live-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}
.live-title { font-weight: 700; color: var(--amber); }
.live-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #e63950;
  border-radius: 50%;
  margin-right: .5rem;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .3; }
}
.live-filters {
  display: flex;
  gap: .5rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.live-filter {
  padding: .5rem .9rem;
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  border-radius: 6px;
  color: var(--ink-2);
  cursor: pointer;
  font-size: .8rem;
  transition: all .15s;
}
.live-filter.active {
  background: var(--amber);
  color: var(--bg);
  border-color: var(--amber);
}
.live-list {
  display: flex;
  flex-direction: column;
  gap: .5rem;
}
.live-event {
  padding: .75rem;
  background: var(--bg-3);
  border-radius: 8px;
  cursor: pointer;
  transition: all .15s;
}
.live-event:hover {
  background: var(--card-hover);
  border-left: 3px solid var(--amber);
}
.live-event-title {
  font-size: .85rem;
  font-weight: 600;
  margin-bottom: .25rem;
}
.live-event-meta {
  font-size: .7rem;
  color: var(--ink-3);
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
}

/* ============================================================
   BREAKING BANNER — duwt header naar beneden
   ============================================================ */
.breaking {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: linear-gradient(135deg, #e63950, #ff6b7a);
  color: white;
  padding: 1rem;
  display: none;
  align-items: center;
  gap: 1rem;
  z-index: 10000;
  cursor: pointer;
}
.breaking.show { display: flex; }
.breaking-icon { font-size: 2rem; line-height: 1; flex-shrink: 0; }
.breaking-text { flex: 1; min-width: 0; }
.breaking-label {
  font-size: .75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .05em;
}
.breaking-title {
  font-size: 1rem;
  font-weight: 700;
  margin-top: .25rem;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.breaking-meta {
  font-size: .75rem;
  opacity: .8;
  margin-top: .25rem;
}
.breaking-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 1.5rem;
  cursor: pointer;
  padding: .25rem .5rem;
  flex-shrink: 0;
}

/* ============================================================
   TOAST
   ============================================================ */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--card);
  border: 1px solid var(--line-2);
  color: var(--ink);
  padding: .75rem 1.5rem;
  border-radius: 8px;
  font-size: .85rem;
  opacity: 0;
  pointer-events: none;
  z-index: 10001;
  box-shadow: var(--shadow-deep);
  transition: all .25s;
  max-width: 90vw;
  text-align: center;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ============================================================
   HOVER — alleen op echte hover-devices
   ============================================================ */
@media (hover: hover) {
  .news-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px -16px var(--accent-glow);
    border-color: var(--amber);
  }
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 900px) {
  .map-page { grid-template-columns: 1fr; }
  .map-wrap { height: 380px; }
}
@media (max-width: 768px) {
  .header-stats { display: none; }
  .vod-page { grid-template-columns: 1fr; }
  .vod-sidebar {
    position: static;
    max-height: none;
    display: flex;
    overflow-x: auto;
    gap: .25rem;
    padding: .5rem;
  }
  .vod-sidebar-group { margin-bottom: 0; flex-shrink: 0; }
  .vod-sidebar-item { white-space: nowrap; }
  .feed-grid { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .brand-text .name { font-size: 1.2rem; }
  .vod-grid { grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); }
  .iptv-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ============================================================
     BREAKING NEWS BANNER
     ============================================================ -->
<div class="breaking" id="breakingBanner" role="button" tabindex="0" aria-label="Breaking news">
  <div class="breaking-icon">⚠️</div>
  <div class="breaking-text">
    <div class="breaking-label">Breaking · <span id="breakingCount">0</span> bronnen</div>
    <div class="breaking-title" id="breakingTitle">—</div>
    <div class="breaking-meta" id="breakingMeta">—</div>
  </div>
  <button class="breaking-close" id="breakingClose" aria-label="Sluiten">✕</button>
</div>

<!-- ============================================================
     HEADER
     ============================================================ -->
<header class="header" id="appHeader">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="2.2" fill="#070c16"/>
          <path d="M12 6.5 C 15.5 6.5, 18.5 9.5, 18.5 12" stroke="#070c16" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M12 3 C 17.5 3, 21.5 7, 21.5 12" stroke="#070c16" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".7"/>
          <path d="M12 17.5 C 8.5 17.5, 5.5 14.5, 5.5 12" stroke="#070c16" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M12 21 C 6.5 21, 2.5 17, 2.5 12" stroke="#070c16" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".7"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="name">WAR DESK</span>
        <span class="tag">LIVE MONITOR · <span class="version-badge" id="appVersion">v13.1</span></span>
      </div>
    </div>
    <div class="header-stats">
      <div class="hstat"><span class="hstat-label">Klok</span><span class="hstat-value" id="clock">--:--:--</span></div>
      <div class="hstat amber"><span class="hstat-label">Bronnen</span><span class="hstat-value" id="statSources">0/0</span></div>
      <div class="hstat coral"><span class="hstat-label">Events</span><span class="hstat-value" id="statEvents">0</span></div>
      <div class="hstat green"><span class="hstat-label">Items</span><span class="hstat-value" id="statItems">0</span></div>
    </div>
    <div class="header-actions">
      <button class="btn-mini" id="btnTheme" aria-label="Thema wisselen">◐</button>
      <button class="btn-mini" id="btnMenu" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<!-- ============================================================
     MAIN CONTENT
     ============================================================ -->
<main class="main">

  <!-- NEWS -->
  <section class="view" id="viewNews">
    <div class="section-head">
      <h2 id="newsTitle">Laatste berichten</h2>
      <div class="section-head-actions">
        <span class="section-count" id="newsCount">—</span>
      </div>
    </div>
    <div class="feed-grid" id="feedGrid"></div>
  </section>

  <!-- MAP -->
  <section class="view" id="viewMap" hidden>
    <div class="map-page">
      <div class="map-wrap">
        <div id="map"></div>
        <div class="map-controls">
          <button class="map-ctrl" id="mapZoomIn" aria-label="Inzoomen">＋</button>
          <button class="map-ctrl" id="mapZoomOut" aria-label="Uitzoomen">－</button>
          <button class="map-ctrl" id="mapLocate" aria-label="Mijn locatie">◎</button>
          <button class="map-ctrl" id="mapFull" aria-label="Volledig scherm">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="live-feed">
        <div class="live-head">

  <!-- IPTV -->
  <section class="view" id="viewIptv" hidden>

      <h2>IPTV</h2>

      <div class="iptv-row"><input type="url" id="iptvServer" placeholder="Server (http://provider.com:80)" autocomplete="off"></div>
      <div class="iptv-row"><input type="text" id="iptvUser" placeholder="Gebruikersnaam" autocomplete="username"></div>

        <button class="iptv-btn" id="iptvTestBtn">🔍 Test</button>
        <button class="iptv-btn primary" id="iptvLoadBtn">⬇ Laad kanalen</button>
      </div>
      <div class="iptv-status" id="iptvStatus"></div>
    </div>
    <div class="iptv-grid" id="iptvGrid"></div>
  </section>

  <!-- VOD -->
  <section class="view" id="viewVod" hidden>
    <div class="section-head">
      <h2>VOD</h2>
      <span class="section-count" id="vodCount">Films &amp; Series</span>
    </div>
    <div class="vod-search-wrap">
      <svg class="vod-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="search" id="vodSearchInput" placeholder="Zoek films of series..." autocomplete="off">
      <button class="vod-search-clear" id="vodSearchClear" aria-label="Wissen">✕</button>

    <div class="vod-page">
      <aside class="vod-sidebar" id="vodSidebar"></aside>
      <div class="vod-content">
        <div class="vod-grid" id="vodGrid"></div>
        <div class="vod-loading" id="vodLoading" hidden>Laden...</div>
      </div>
    </div>
    <button class="vod-scroll-top" id="vodScrollTop" aria-label="Naar boven">↑</button>
  </section>
</main>

<!-- ============================================================
     INIT — wacht tot alle modules geladen zijn
     ============================================================ -->
<script>
(function(){
  function boot(){
    var ok = window.NewsAPI && typeof window.NewsAPI.init === "function";
    if (!ok) {
      // Modules mogelijk nog niet geladen (defer-volgorde). Probeer opnieuw.
      if (!boot._tries) boot._tries = 0;
      if (boot._tries++ < 40) { setTimeout(boot, 100); return; }
      console.warn("[WAR DESK] NewsAPI niet gevonden na 4s");
      var grid = document.getElementById("feedGrid");
      if (grid && !grid.children.length) {
        grid.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--ink-3)">Kon nieuws niet laden. Ververs de pagina.</div>';
      }
      return;
    }
    window.NewsAPI.init()
      .then(function(){ /* console.log("[WAR DESK] ✅ gestart"); */ })
      .catch(function(err){ console.warn("[WAR DESK] init error:", err); });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

/* ============================================================
   DEBUG — alleen actief met ?debug in URL
   ============================================================ */
if (new URLSearchParams(location.search).has("debug")) {
  var s = document.createElement("script");
  s.src = "https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js";
  s.onload = function(){ if (window.VConsole) new window.VConsole(); };
  document.body.appendChild(s);
}
</script>
