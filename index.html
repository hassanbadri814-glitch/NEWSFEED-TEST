<script>
try{
  var t = localStorage.getItem("wardesk_theme");
  if(t === "light" || (!t && matchMedia("(prefers-color-scheme:light)").matches)){
    document.documentElement.classList.add("light");
  }
}catch(e){}
try{
  var fs = localStorage.getItem("wardesk_font_size") || "medium";
  var ac = localStorage.getItem("wardesk_accent_color") || "goud";
  var map = { amber:"goud", blue:"saffier", green:"smaragd", red:"koraal", mono:"parel" };
  if(map[ac]) { ac = map[ac]; localStorage.setItem("wardesk_accent_color", ac); }
  if(["goud","saffier","smaragd","kobalt","koraal","parel"].indexOf(ac) < 0) ac = "goud";
  document.documentElement.setAttribute("data-font-size", fs);
  document.documentElement.setAttribute("data-accent", ac);
  if(localStorage.getItem("wardesk_oled_mode") === "1"){
    document.documentElement.setAttribute("data-oled", "true");
  }
}catch(e){}
</script>

<style>
/* ============================================================
   WAR DESK v13.0 - COMPLETE CSS (NO OVERLAPS)
   ============================================================ */

:root {
  --amber: #e0a857;
  --amber-2: #f0c78a;
  --amber-3: #8a5c26;
  --accent-glow: rgba(224,168,87,.35);
  --bg: #070c16;
  --bg-2: #0d1522;
  --bg-3: #131e30;
  --card: #111b2d;
  --card-hover: #18253c;
  --line: #1a2540;
  --line-2: #26344f;
  --ink: #e6ebf5;
  --ink-2: #8a94a8;
  --ink-3: #6b7a93;
  --radius: 12px;
  --shadow-card: 0 2px 8px rgba(0,0,0,.3);
  --shadow-deep: 0 8px 32px rgba(0,0,0,.5);
}

html[data-accent="goud"] { --amber:#e0a857; --amber-2:#f0c78a; --amber-3:#8a5c26; }
html[data-accent="saffier"] { --amber:#5b9dff; --amber-2:#93c2ff; --amber-3:#1e40af; }
html[data-accent="smaragd"] { --amber:#2dd4a8; --amber-2:#6ee7c8; --amber-3:#065f46; }
html[data-accent="kobalt"] { --amber:#8b7fff; --amber-2:#b3aaff; --amber-3:#3a2a99; }
html[data-accent="koraal"] { --amber:#ff6b7a; --amber-2:#ff9ba6; --amber-3:#991b2c; }
html[data-accent="parel"] { --amber:#e8eaf0; --amber-2:#ffffff; --amber-3:#6b7280; }
html[data-oled="true"] { --bg:#000000; --bg-2:#050505; --bg-3:#0d0d0d; --card:#080808; }

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 80px;
}

/* HEADER */
.header {
  background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--line);
  padding: 1rem;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-inner {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 1rem;
  align-items: center;
}
.brand { display: flex; align-items: center; gap: .75rem; }
.brand-mark {
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, var(--amber-2), var(--amber-3));
  border-radius: 12px;
  display: grid;
  place-items: center;
}
.brand-mark svg { width: 28px; height: 28px; }
.brand-text { display: flex; flex-direction: column; }
.brand-text .name {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--amber);
  line-height: 1;
}
.brand-text .tag {
  font-size: .7rem;
  color: var(--ink-3);
  letter-spacing: .1em;
  margin-top: .25rem;
}
.version-badge {
  background: var(--amber);
  color: var(--bg);
  padding: .15rem .4rem;
  border-radius: 4px;
  font-size: .65rem;
  font-weight: 700;
}
.header-stats {
  display: flex;
  gap: 1rem;
  justify-content: space-around;
}
.hstat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .25rem;
}
.hstat-label {
  font-size: .6rem;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: .05em;
}
.hstat-value {
  font-size: 1.1rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.hstat.amber .hstat-value { color: var(--amber); }
.hstat.coral .hstat-value { color: #ff6b7a; }
.hstat.green .hstat-value { color: #2dd4a8; }
.hstat.teal .hstat-value { color: #06b6d4; }
.header-actions { display: flex; gap: .5rem; }
.btn-mini {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  color: var(--ink-2);
  font-size: 1.2rem;
  cursor: pointer;
  display: grid;
  place-items: center;
}

/* MAIN */
.main {
  padding: 1rem;
  padding-bottom: 90px;
}
.view { display: none; }
.view:not([hidden]) { display: block; }

/* SECTION HEAD */
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}
.section-head h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  font-weight: 700;
}
.section-count {
  font-size: .85rem;
  color: var(--ink-3);
}

/* FEED GRID */
.feed-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1rem;
}
.news-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: all .18s;
}
.news-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 24px -16px var(--accent-glow);
  border-color: var(--amber);
}
.news-card.read { opacity: .7; }
.news-card.war { border-left: 3px solid #e63950; }
.card-thumb {
  width: 100%;
  aspect-ratio: 16/9;
  overflow: hidden;
  background: var(--bg-3);
}
.card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card-body { padding: 1rem; }
.card-meta {
  display: flex;
  align-items: center;
  gap: .5rem;
  font-size: .75rem;
  color: var(--ink-3);
  margin-bottom: .5rem;
}
.card-source { color: var(--amber); font-weight: 600; }
.card-multi {
  background: var(--bg-3);
  padding: .15rem .4rem;
  border-radius: 4px;
  font-size: .7rem;
}
.card-title {
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: .5rem;
}
.card-original {
  font-size: .72rem;
  color: var(--ink-3);
  font-style: italic;
  margin-bottom: .5rem;
  opacity: .7;
}
.card-desc {
  font-size: .85rem;
  color: var(--ink-2);
  line-height: 1.5;
  margin-bottom: .75rem;
}
.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: .75rem;
  color: var(--ink-3);
}
.card-actions { display: flex; gap: .5rem; }
.card-fav, .card-share {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  color: var(--ink-3);
  cursor: pointer;
  display: grid;
  place-items: center;
}
.card-fav.active {
  background: var(--amber);
  color: var(--bg);
  border-color: var(--amber);
}

/* BOTTOM TABS - HIGHEST Z-INDEX */
.bottom-tabs {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-2);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  padding: .5rem 0;
  z-index: 9999;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .25rem;
  padding: .5rem;
  background: transparent;
  border: none;
  color: var(--ink-3);
  cursor: pointer;
}
.tab.active { color: var(--amber); }
.tab-icon { font-size: 1.5rem; }
.tab-label { font-size: .7rem; font-weight: 600; }

/* VOD */
.vod-search-wrap {
  position: relative;
  margin-bottom: 1rem;
}
.vod-search-icon {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--ink-3);
}
.vod-search-wrap input {
  width: 100%;
  padding: .75rem 1rem .75rem 3rem;
  background: var(--card);
  border: 1px solid var(--line-2);
  border-radius: 10px;
  color: var(--ink);
  font-size: .9rem;
  outline: none;
}
.vod-search-wrap input:focus {
  border-color: var(--amber);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.vod-search-clear {
  position: absolute;
  right: .5rem;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  background: transparent;
  border: none;
  color: var(--ink-3);
  font-size: 1.2rem;
  cursor: pointer;
}
.vod-page {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 1rem;
}
.vod-sidebar {
  position: sticky;
  top: 1rem;
  max-height: calc(100vh - 200px);
  overflow-y: auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: .5rem;
}
.vod-sidebar-group { margin-bottom: 1rem; }
.vod-sidebar-title {
  font-size: .6rem;
  font-weight: 800;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: .1em;
  padding: .5rem;
}
.vod-sidebar-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .5rem;
  background: transparent;
  border: none;
  color: var(--ink-2);
  font-size: .75rem;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
}
.vod-sidebar-item:hover { background: var(--bg-3); color: var(--amber); }
.vod-sidebar-item.active {
  background: rgba(224,168,87,.14);
  color: var(--amber);
  font-weight: 700;
}
.vod-sidebar-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.vod-sidebar-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.vod-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: .75rem;
}
.vod-poster {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: all .18s;
}
.vod-poster:hover {
  transform: translateY(-2px);
  border-color: var(--amber);
  box-shadow: 0 10px 24px -16px var(--accent-glow);
}
.vod-poster-img {
  width: 100%;
  aspect-ratio: 2/3;
  background: var(--bg-3);
  overflow: hidden;
}
.vod-poster-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.vod-poster-fallback {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  font-size: 2rem;
  font-weight: 800;
  color: var(--amber);
  opacity: .5;
}
.vod-poster-body { padding: .5rem; }
.vod-poster-name {
  font-size: .75rem;
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: .25rem;
}
.vod-poster-meta {
  font-size: .6rem;
  color: var(--ink-3);
}
.vod-loading {
  text-align: center;
  padding: 2rem;
  color: var(--amber);
}
.vod-scroll-top {
  position: fixed;
  bottom: 100px;
  right: 16px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--line-2);
  color: var(--amber);
  cursor: pointer;
  display: none;
  place-items: center;
  z-index: 9998;
}
.vod-scroll-top.show { display: grid; }

/* IPTV */
.iptv-setup {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1rem;
  margin-bottom: 1rem;
}
.iptv-setup-title {
  font-size: .75rem;
  font-weight: 800;
  color: var(--ink-3);
  text-transform: uppercase;
  margin-bottom: 1rem;
}
.iptv-row { margin-bottom: .75rem; }
.iptv-row input {
  width: 100%;
  padding: .75rem;
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  color: var(--ink);
  font-size: .9rem;
}
.iptv-btn {
  padding: .75rem 1rem;
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  color: var(--ink);
  cursor: pointer;
  font-weight: 600;
}
.iptv-btn.primary {
  background: var(--amber);
  color: var(--bg);
  border-color: var(--amber);
}
.iptv-btn.danger { color: #e63950; }
.iptv-status {
  margin-top: .5rem;
  font-size: .85rem;
  color: var(--ink-2);
}

/* MAP */
.map-page {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 1rem;
}
.map-wrap {
  position: relative;
  height: 500px;
  border-radius: 12px;
  overflow: hidden;
}
#map { width: 100%; height: 100%; }
.map-controls {
  position: absolute;
  top: 1rem;
  right: 1rem;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  z-index: 500;
}
.map-ctrl {
  width: 40px;
  height: 40px;
  background: var(--card);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  color: var(--ink);
  cursor: pointer;
  font-size: 1.2rem;
}
.live-feed {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1rem;
  max-height: 500px;
  overflow-y: auto;
}
.live-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}
.live-title {
  font-weight: 700;
  color: var(--amber);
}
.live-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #e63950;
  border-radius: 50%;
  margin-right: .5rem;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .3; }
}
.live-filters {
  display: flex;
  gap: .5rem;
  margin-bottom: 1rem;
}
.live-filter {
  padding: .5rem 1rem;
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  border-radius: 6px;
  color: var(--ink-2);
  cursor: pointer;
  font-size: .8rem;
}
.live-filter.active {
  background: var(--amber);
  color: var(--bg);
  border-color: var(--amber);
}
.live-event {
  padding: .75rem;
  background: var(--bg-3);
  border-radius: 8px;
  margin-bottom: .5rem;
  cursor: pointer;
}
.live-event:hover {
  background: var(--card-hover);
  border-left: 3px solid var(--amber);
}
.live-event-title {
  font-size: .85rem;
  font-weight: 600;
  margin-bottom: .25rem;
}
.live-event-meta {
  font-size: .7rem;
  color: var(--ink-3);
  display: flex;
  gap: .5rem;
}

/* BREAKING BANNER */
.breaking {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: linear-gradient(135deg, #e63950, #ff6b7a);
  color: white;
  padding: 1rem;
  display: none;
  align-items: center;
  gap: 1rem;
  z-index: 10000;
  cursor: pointer;
}
.breaking.show { display: flex; }
.breaking-icon { font-size: 2rem; }
.breaking-text { flex: 1; }
.breaking-label {
  font-size: .75rem;
  font-weight: 700;
  text-transform: uppercase;
}
.breaking-title {
  font-size: 1rem;
  font-weight: 700;
  margin-top: .25rem;
}
.breaking-meta {
  font-size: .75rem;
  opacity: .8;
  margin-top: .25rem;
}
.breaking-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 1.5rem;
  cursor: pointer;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  border: 1px solid var(--line-2);
  color: var(--ink);
  padding: .75rem 1.5rem;
  border-radius: 8px;
  font-size: .85rem;
  display: none;
  z-index: 10001;
  box-shadow: var(--shadow-deep);
}
.toast.show { display: block; }

/* RESPONSIVE */
@media (max-width: 768px) {
  .header-stats { display: none; }
  .map-page { grid-template-columns: 1fr; }
  .vod-page { grid-template-columns: 1fr; }
  .feed-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- BREAKING NEWS BANNER -->
<div class="breaking" id="breakingBanner" role="button" tabindex="0">
  <div class="breaking-icon"></div>
  <div class="breaking-text">
    <div class="breaking-label">Breaking · <span id="breakingCount">0</span> bronnen</div>
    <div class="breaking-title" id="breakingTitle">—</div>
    <div class="breaking-meta" id="breakingMeta">—</div>
  </div>
  <button class="breaking-close" id="breakingClose">✕</button>
</div>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2.2" fill="#070c16"/><path d="M12 6.5 C 15.5 6.5, 18.5 9.5, 18.5 12" stroke="#070c16" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M12 3 C 17.5 3, 21.5 7, 21.5 12" stroke="#070c16" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".7"/><path d="M12 17.5 C 8.5 17.5, 5.5 14.5, 5.5 12" stroke="#070c16" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M12 21 C 6.5 21, 2.5 17, 2.5 12" stroke="#070c16" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".7"/></svg>
      </div>
      <div class="brand-text">
        <span class="name">WAR DESK</span>
        <span class="tag">LIVE MONITOR · <span class="version-badge" id="appVersion">v13.0</span></span>
      </div>
    </div>
    <div class="header-stats">
      <div class="hstat"><span class="hstat-label">Klok</span><span class="hstat-value" id="clock">--:--:--</span></div>
      <div class="hstat amber"><span class="hstat-label">Bronnen</span><span class="hstat-value" id="statSources">0/0</span></div>
      <div class="hstat coral"><span class="hstat-label">Events</span><span class="hstat-value" id="statEvents">0</span></div>
      <div class="hstat green"><span class="hstat-label">Items</span><span class="hstat-value" id="statItems">0</span></div>
    </div>
    <div class="header-actions">
      <button class="btn-mini" id="btnTheme" aria-label="Thema">◐</button>
      <button class="btn-mini" id="btnMenu" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<!-- MAIN CONTENT -->
<main class="main">
  <section class="view" id="viewNews">
    <div class="section-head">
      <h2 id="newsTitle">Laatste berichten</h2>
      <div class="section-head-actions">
        <span class="section-count" id="newsCount">—</span>
      </div>
    </div>
    <div class="feed-grid" id="feedGrid"></div>
  </section>

  <section class="view" id="viewMap" hidden>
    <div class="map-page">

        <div class="map-controls">
          <button class="map-ctrl" id="mapZoomIn">＋</button>
          <button class="map-ctrl" id="mapZoomOut">－</button>
          <button class="map-ctrl" id="mapLocate">◎</button>

      <div class="live-feed">

        </div>

  <section class="view" id="viewIptv" hidden>

      <h2>IPTV</h2>
      <span class="section-count" id="iptvCount">0 kanalen</span>

    <div class="iptv-setup" id="iptvSetup">
      <div class="iptv-setup-title">Xtream Codes Login</div>
      <div class="iptv-row"><input type="url" id="iptvServer" placeholder="Server (http://provider.com:80)"></div>
      <div class="iptv-row"><input type="text" id="iptvUser" placeholder="Username"></div>
      <div class="iptv-row"><input type="password" id="iptvPass" placeholder="Password"></div>
      <div class="iptv-row">
        <button class="iptv-btn" id="iptvTestBtn">🔍 Test</button>
        <button class="iptv-btn primary" id="iptvLoadBtn">⬇ Laad kanalen</button>
      </div>
      <div class="iptv-status" id="iptvStatus"></div>
    </div>
    <div class="iptv-grid" id="iptvGrid"></div>
  </section>

  <section class="view" id="viewVod" hidden>
    <div class="section-head">
      <h2>VOD</h2>
      <span class="section-count" id="vodCount">Films & Series</span>
    </div>
    <div class="vod-search-wrap">
      <svg class="vod-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="vodSearchInput" placeholder="Zoek films...">
      <button class="vod-search-clear" id="vodSearchClear">✕</button>
    </div>
    <div class="vod-page">
      <aside class="vod-sidebar" id="vodSidebar"></aside>
      <div class="vod-content">
        <div class="vod-grid" id="vodGrid"></div>
        <div class="vod-loading" id="vodLoading">Laden...</div>
      </div>
    </div>
    <button class="vod-scroll-top" id="vodScrollTop">↑</button>
  </section>
