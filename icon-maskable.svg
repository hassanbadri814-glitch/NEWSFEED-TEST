<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%"   stop-color="#182238"/>
      <stop offset="55%"  stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#040710"/>
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fad9a1"/>
      <stop offset="45%"  stop-color="#e2a857"/>
      <stop offset="100%" stop-color="#b87c2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e2a857" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e2a857" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#ff8899"/>
      <stop offset="55%"  stop-color="#e63950"/>
      <stop offset="100%" stop-color="#8a1a28"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <ellipse cx="256" cy="256" rx="230" ry="180" fill="url(#glow)"/>
    <circle cx="256" cy="256" r="200" fill="none" stroke="#e2a857" stroke-width="1.2" opacity="0.10"/>
    <circle cx="256" cy="256" r="240" fill="none" stroke="#e2a857" stroke-width="1.2" opacity="0.05"/>
    <text x="256" y="248"
          font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="140"
          font-weight="900"
          letter-spacing="2"
          text-anchor="middle"
          fill="url(#amberGrad)"
          filter="url(#softGlow)">WAR</text>
    <line x1="150" y1="295" x2="362" y2="295"
          stroke="#e2a857" stroke-width="3" opacity="0.55" stroke-linecap="round"/>
    <text x="256" y="415"
          font-family="'Arial Black', 'Helvetica Neue', Helvetica, sans-serif"
          font-size="140"
          font-weight="900"
          letter-spacing="2"
          text-anchor="middle"
          fill="url(#amberGrad)"
          filter="url(#softGlow)">DESK</text>
    <circle cx="418" cy="94" r="24" fill="url(#redGrad)"/>
    <circle cx="418" cy="94" r="9" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>